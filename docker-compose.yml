
services:
  db:
    image: postgres:16
    restart: unless-stopped
    env_file: .env
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./backend:/app/backend
      - ./main.py:/app/main.py
      - ./alembic.ini:/app/alembic.ini
      - ./pyproject.toml:/app/pyproject.toml
      - scrape_storage:/app/storage
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "${PORT_BACKEND}:8000"
    healthcheck:
      # Hits the /health endpoint; urlopen raises (non-zero exit) on a 503,
      # marking the container unhealthy when the DB or Redis is unreachable.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    restart: unless-stopped
    env_file: .env
    entrypoint: []
    # Behind the "worker" profile so `docker compose --profile worker up` runs
    # the async pipeline (Milestone 4). concurrency=4 matches celery_app config.
    profiles: ["worker"]
    command: celery -A backend.workers.celery_app worker --loglevel=info --concurrency=4 -Q scrape,parse,aggregate,celery
    volumes:
      - ./backend:/app/backend
      - ./main.py:/app/main.py
      - ./alembic.ini:/app/alembic.ini
      - scrape_storage:/app/storage
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  beat:
    build:
      context: .
      dockerfile: Dockerfile.worker
    restart: unless-stopped
    env_file: .env
    entrypoint: []
    profiles: ["worker"]
    command: celery -A backend.workers.celery_app beat --loglevel=info
    volumes:
      - ./backend:/app/backend
      - ./main.py:/app/main.py
      - ./alembic.ini:/app/alembic.ini
    depends_on:
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        - VITE_API_URL=${VITE_API_URL}
    restart: unless-stopped
    env_file: .env
    ports:
      - "${PORT_FRONTEND}:80"
    depends_on:
      - api

volumes:
  postgres_data:
  redis_data:
  scrape_storage:
